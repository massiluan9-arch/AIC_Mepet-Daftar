# Parameter perancangan solusi dan analisis biaya-manfaat.
# status: data, regulasi, atau asumsi (asumsi selalu diuji).

kendala:
  C1: "P(R < 100%) paling besar 0,5% setahun pada kurva kerentanan campuran"
  C2: "P(R < 100%) paling besar 0,5% setahun pada kurva Aulady & Fujimi saja (kurva dengan bobot terbesar)"
  C3: "Rasio akhir paling rendah 100% setelah skenario megathrust Jawa bagian barat M 8,7 dengan guncangan median"
  target_paling_rendah: 1.20        # POJK 26/2025 Pasal 3

skenario_uji:
  nama: "Megathrust Jawa bagian barat M 8,7"
  eta: 0
  kurva: campuran

# Strategi yang tidak dijadikan calon, beserta alasannya.
dikecualikan:
  S1_rs5: "Tabel tarif gempa SEOJK 6/2017 tidak memberi potongan premi untuk risiko sendiri di atas 2,5%, jadi sulit dipasarkan"
  S2_rs10: "Sama dengan S1"
  S7_paketA: "Memuat risiko sendiri 5%"
  S8_paketB: "Memuat risiko sendiri 5%"

biaya_modal:
  nilai: 0.13
  uji: [0.10, 0.16]
  status: asumsi
  catatan: "Imbal hasil yang dituntut pemegang saham. Patokan: SBN 10 tahun 7,16% ditambah premi risiko ekuitas sekitar 6 poin."

skala_rupiah:
  premi_harta_benda_miliar: 1000.0
  status: asumsi
  catatan: "Pada premi Rp1 triliun, ekuitas untuk rasio 120% sekitar Rp228 miliar, dekat dengan ekuitas minimum Rp250 miliar (POJK 23/2023). Premi harta benda terbesar di industri Rp2,2 triliun; median Rp177 miliar (OJK 2024)."

horizon_tahun: 5

