  - {id: L2, isi: "Imbal hasil SBN bulanan hanya 2012-2024 (155 bulan); ekor 1-dalam-200 tidak teridentifikasi dengan pasti.", bukti: {var_K75_blok_12: {{turunan.var_K75_menurut_blok.12|n4}}, var_K75_blok_3: {{turunan.var_K75_menurut_blok.3|n4}}}}
