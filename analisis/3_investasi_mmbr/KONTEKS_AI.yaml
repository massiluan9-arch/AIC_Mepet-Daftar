  - {id: Q5, isi: "Status berlaku POJK 1/POJK.05/2016 pada 2026", pemutus: tim}
  - {id: Q6, isi: "Imbal hasil SBN bulanan 2025-2026 dari DJPPR untuk menghapus imputasi dua tahun terakhir", pemutus: tim}
  - {id: Q7, isi: "Satu istilah satuan neraca di paper: per 100 premi dicatat atau per 100 premi neto", pemutus: tim}

perbedaan_dari_dokumen_lama:
  dokumen: "rancangan metode awal tim (tidak disertakan di repo)"
  butir:
    - {hal: "beban modal aset Moderat per 100 investasi", lama: [2.24, 3.28], baru: [2.24, 3.00], sebab: "faktor risiko hanya atas porsi yang diakui AYD"}
    - {hal: "beban modal aset Agresif per 100 investasi", lama: [5.24, 7.68], baru: [3.80, 7.12], sebab: "sama"}
    - {hal: "MMBR per 100 premi", lama: [24, 35], baru: [18.9, 27.8], sebab: "cadangan dari data lini harta benda; DAC dari rasio industri"}
    - {hal: "rekonstruksi rasio industri", lama: [2.56, 3.52], baru: [1.91, 3.13], sebab: "pembilang AYD dikurangi liabilitas, bukan ekuitas"}
  akibat: "Tabel indikatif soal 4 (bagian 8.3 dokumen lama) perlu dihitung ulang dengan MMBR baru saat model bencana dijalankan."

langkah_berikut:
  - "Jalankan model kerugian bencana dan sambungkan L(m) ke rasio akhir tahun."
  - "Tambahkan hasil underwriting non-bencana U dari rasio klaim harta benda OJK 2011-2024."
  - "Hitung peluang pelanggaran gabungan; putuskan komposisi dalam rentang Konservatif dan target solvabilitas."
  - "Ganti cadangan bencana dengan nilai menurut Pasal 28 ayat (7) POJK 26/2025."
