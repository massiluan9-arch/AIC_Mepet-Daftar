temuan:
  - id: T1
    pernyataan: "Hanya profil Konservatif yang patuh batas AYD di seluruh rentang brief."
    bukti:
      tidak_diakui: {K80: 0.00, K75: 0.00, K70: 0.00, M40: 0.00, M50: 0.00, M60: 0.10, A20: 0.30, A30: 0.20, A40: 0.20}
    dasar: "POJK 26/2025 Pasal 15 ayat (1) huruf e, huruf h, dan ayat (4)"
    bergantung_pada: [tafsir perlakuan kelebihan]
    kekuatan: tinggi
    soal: [1]
  - id: T2
    pernyataan: "Beban modal aset dan ekuitas untuk target 120% naik dari Konservatif ke Moderat ke Agresif; varian yang melampaui batas AYD membutuhkan ekuitas jauh lebih besar."
    bukti:
      ekuitas_pada_120: {K75: 22.78, M50: 25.67, M60: 36.85, A30: 56.77}
      kelipatan_ekuitas_A30_terhadap_K75: 2.49
      rasio_bila_neraca_sama: {K75: 1.200, M50: 1.069, M60: 0.629, A30: 0.168}
    kekuatan: tinggi
    soal: [1]
  - id: T3
    pernyataan: "Imbal hasil riil ketiga profil positif; Moderat memberi sekitar 0.0066 (desimal) lebih tinggi daripada Konservatif; Agresif tidak lebih tinggi daripada Moderat pada jendela bersama."
    bukti:
      rata_bersama: {K75: 0.0639, M50: 0.0704, A30: 0.0694}
      rata_panjang: {K75: 0.0665, M50: 0.0792, A30: 0.0914}
      inflasi: 0.0328
    bergantung_pada: [jendela data, imbal_dividen]
    kekuatan: sedang
    catatan: "Rata-rata imbal hasil saham tidak stabil antarjendela."
    soal: [1]
  - id: T4
    pernyataan: "Dengan rasio awal 120% dan hanya investasi yang bergerak, peluang rasio jatuh di bawah 100% berada di bawah ambang 0,5% untuk Konservatif pada kedua jendela, di sekitar ambang untuk Moderat pada jendela bersama dan di atasnya pada jendela panjang, dan di atas ambang untuk Agresif."
    bukti:
      peluang_bersama: {K80: 0.0042, K75: 0.0026, K70: 0.0015, M40: 0.0057, M50: 0.0041, A20: 0.0113, A30: 0.0284, A40: 0.0642}
      peluang_panjang: {K75: 0.0020, M50: 0.0110, A30: 0.0781}
      ambang: 0.005
    bergantung_pada: [tenor_sbn, panjang_blok, klasifikasi_obligasi]
    kekuatan: sedang
    catatan: "Pada blok 3 bulan K80 menjadi 0.0054; pada blok 12 bulan semua varian patuh mendekati nol."
    soal: [1, 4]
  - id: T5
    pernyataan: "Tenor SBN menentukan risiko profil Konservatif lebih daripada porsi deposito; SBN 10 tahun membuat Konservatif lebih berisiko daripada Moderat."
    bukti:
      peluang_K75_menurut_tenor: {"2": 0.0000, "5": 0.0026, "10": 0.0540}
      var_99_5_K75_menurut_tenor: {"2": -0.0360, "5": 0.0316, "10": 0.1019}
      imbal_awal: {"2": 0.0678, "5": 0.0705, "10": 0.0718}
    kekuatan: tinggi
    implikasi: "Rekomendasi profil harus disertai batas tenor (paling panjang 5 tahun)."
    soal: [1, 4]
  - id: T6
    pernyataan: "Rumus MMBR tidak menangkap risiko suku bunga SBN: beban modal aset jauh di bawah kerugian 1-dalam-200 hasil simulasi."
    bukti:
      per_100_investasi_K75: {beban_mmbr_aset: 0.53, var_99_5_bersama: 3.16}
      per_100_investasi_A40: {beban_mmbr_aset: 7.12, var_99_5_panjang: 19.38}
    dasar: "SEOJK 24/2017: SBN berfaktor 0%; risiko tingkat bunga hanya atas cadangan premi jangka panjang"
    kekuatan: tinggi
    soal: [3, 4]
  - id: T7
    pernyataan: "Bantalan 20% untuk varian acuan hanya 3.80 per 100 premi; kerugian investasi 1-dalam-200 memakai 0.78 bagiannya."
    bukti:
      bantalan: 3.796
      kerugian_investasi_1_dalam_200: 2.963
      sisa: 0.833
      imbal_hasil_pemicu_pelanggaran: -0.0405
    bergantung_pada: [tenor_sbn, panjang_blok]
    kekuatan: sedang
    soal: [4]
  - id: T8
    pernyataan: "Risiko asuransi adalah modul MMBR terbesar pada semua varian; porsinya 0.76 sampai 0.86 pada varian yang patuh. Nilainya tidak bergantung pada eksposur bencana, hanya pada cadangan."
    bukti:
      mmbr_asuransi: 16.306
      mmbr_total: {K75: 18.982, M50: 21.388, A40: 27.769}
    kekuatan: tinggi
    catatan: "Ini besaran, bukan kemungkinan. Soal 3 menanyakan kemungkinan; itu menunggu model bencana."
    soal: [3, 4]
  - id: T9
    pernyataan: "Hanya profil ber-SBN yang dapat memenuhi dana jaminan dari portofolionya dan memakai repo SBN; profil Agresif hanya punya kas sebagai aset siap cair."
    bukti:
      aset_siap_cair_per_100_premi: {K75: 94.0, M50: 42.0, A30: 7.3}
    dasar: "POJK 26/2025 Pasal 8, Pasal 56 ayat (4)"
    kekuatan: tinggi
    soal: [1, 2]
  - id: T10
    pernyataan: "Mesin MMBR menghasilkan rasio industri yang seorde dengan angka resmi tetapi cenderung lebih rendah."
    bukti:
      rasio_rekonstruksi: [1.906, 3.131]
      rasio_resmi_ojk: 3.248
    kekuatan: sedang
    implikasi: "Pakai untuk membandingkan profil, bukan untuk meniru angka OJK."
    soal: []

