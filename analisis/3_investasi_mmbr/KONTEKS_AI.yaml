keterbatasan:
  - {id: L1, isi: "Model bencana dan hasil underwriting belum masuk; peluang gabungan lebih tinggi daripada yang dilaporkan.", arah: "kurang-taksir risiko semua profil"}
  - {id: L2, isi: "Imbal hasil SBN bulanan hanya 2012-2024 (155 bulan); ekor 1-dalam-200 tidak teridentifikasi dengan pasti.", bukti: {var_K75_blok_12: 0.0113, var_K75_blok_3: 0.0358}}
  - {id: L3, isi: "Selisih kredit dianggap tetap dan peluang gagal bayar belum bersumber.", arah: "menguntungkan Moderat dan Agresif"}
  - {id: L4, isi: "Jendela panjang memakai imputasi perubahan imbal hasil.", bukti: {r2: 0.258}}
  - {id: L5, isi: "Neraca fiktif dari rasio industri; CAPYBMP paling menggeser hasil."}
  - {id: L6, isi: "Sebelum pajak dan biaya transaksi."}
  - {id: L7, isi: "Rumus risiko likuiditas dibaca harfiah.", bukti: {modul_likuiditas_K75: 0.486}}

